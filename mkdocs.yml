site_name: Hakowan - A 3D Data Visualization Grammar
site_url: https://hakowan.github.io/hakowan/

repo_url: https://github.com/Hakowan/hakowan
edit_uri: blob/main/docs/

theme:
  code:
    fold:
      enabled: true
      lines: 24
  name: materialx
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.agents
    - content.footnote.tooltips
    - toc.follow
  logo: images/hakowan_logo.svg
  favicon: images/hakowan_logo.svg

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference


plugins:
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: google
          show_root_heading: false
          show_root_toc_entry: false
          preload_modules:
          - hakowan
- search:
    provider: pagefind
    pagefind:
      options:
        excerptLength: 40
        ranking:
          metaWeights:
            title: 8.0


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


nav:
- Home: index.md
- User guide:
  - Grammar: guide/grammar.md
  - Data: guide/data.md
  - Attribute: guide/attribute.md
  - Scale: guide/scale.md
  - Mark: guide/mark.md
  - Texture: guide/texture.md
  - Material: guide/material.md
  - Channel: guide/channel.md
  - Transform: guide/transform.md
  - Layer: guide/layer.md
  - Figure and scene: guide/figure.md
  - Legends and annotations: guide/overlay.md
  - Configuration: guide/config.md
  - Compile: guide/compile.md
  - Backend: guide/backend.md
  - Snapshot and observation: guide/observation.md
- Specification:
  - Overview: guide/schema.md
  - Python API: api/spec.md
  - JSON Schema: schema/v1.json
- Gallery: gallery.md
- Reference:
  - Render: api/render.md
  - Figure and scene: api/figure.md
  - Snapshot and observation: api/observation.md
  - Compile: api/compile.md
  - Data: api/data.md
  - Mark: api/mark.md
  - Channel: api/channel.md
  - Transform: api/transform.md
  - Attribute: api/attribute.md
  - Scale: api/scale.md
  - Legends and annotations: api/overlay.md
  - Material: api/material.md
  - Texture: api/texture.md
  - Layer: api/layer.md
  - Color: api/color.md
  - ColorMap: api/colormap.md
  - Medium: api/medium.md
  - CurveStyle: api/curve_style.md
  - Configuration: api/config.md
