<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{{TITLE}}</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: rgb({{BG_R_255}}, {{BG_G_255}}, {{BG_B_255}}); overflow: hidden; }
  #viewer { width: 100vw; height: 100vh; display: block; }
  #status {
    position: absolute; top: 8px; left: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px; color: #ccc;
    background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px;
    pointer-events: none;
  }
  #status.hidden { display: none; }
  #passes {
    position: absolute; top: 8px; right: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px; color: #eee;
    background: rgba(0,0,0,0.45); padding: 4px; border-radius: 4px;
    display: none;
  }
  #passes.visible { display: flex; gap: 4px; }
  #passes button {
    background: rgba(255,255,255,0.08); color: #eee; border: 0;
    padding: 4px 8px; border-radius: 3px; font: inherit; cursor: pointer;
  }
  #passes button:hover { background: rgba(255,255,255,0.18); }
  #passes button.active { background: rgba(255,255,255,0.28); }
  #passes .sep { width: 1px; background: rgba(255,255,255,0.18); margin: 0 2px; }
  #clip-controls {
    position: absolute; top: 44px; right: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px; color: #eee;
    background: rgba(0,0,0,0.45); padding: 6px; border-radius: 4px;
    display: none; flex-direction: column; gap: 4px;
  }
  #clip-controls.visible { display: flex; }
  #clip-controls .row { display: flex; gap: 4px; align-items: center; }
  #clip-controls button {
    background: rgba(255,255,255,0.08); color: #eee; border: 0;
    padding: 4px 8px; border-radius: 3px; font: inherit; cursor: pointer;
  }
  #clip-controls button:hover { background: rgba(255,255,255,0.18); }
  #clip-controls button.active { background: rgba(255,255,255,0.28); }
  #clip-controls input[type=range] { width: 150px; accent-color: #ccc; }
  #layers {
    position: absolute; bottom: 8px; left: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px; color: #eee;
    background: rgba(0,0,0,0.45); padding: 6px 8px; border-radius: 4px;
    display: none; flex-direction: column; gap: 3px;
    max-height: 40vh; overflow-y: auto;
  }
  #layers.visible { display: flex; }
  #layers .title {
    font-size: 11px; color: #aaa; margin-bottom: 2px; user-select: none;
  }
  #layers label {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    white-space: nowrap;
  }
  #layers input[type=checkbox] { accent-color: #ccc; cursor: pointer; }
  .semantic-legends {
    position: absolute; top: 56px; display: flex; flex-direction: column;
    gap: 8px; max-height: calc(100vh - 72px); overflow-y: auto;
    font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    pointer-events: none;
  }
  #semantic-legends-left { left: 8px; }
  #semantic-legends-right { right: 8px; }
  .semantic-legend {
    min-width: 130px; padding: 8px; border-radius: 4px;
    color: #eee; background: rgba(0,0,0,0.58);
  }
  .semantic-legend .heading { font-weight: 600; margin-bottom: 5px; }
  .semantic-legend .scale { color: #bbb; font-size: 10px; margin-bottom: 4px; }
  .semantic-legend .continuous { display: flex; gap: 6px; height: 150px; }
  .semantic-legend .bar { width: 18px; border: 1px solid rgba(255,255,255,.6); }
  .semantic-legend .ticks { display: flex; flex-direction: column; justify-content: space-between; }
  .semantic-legend .category { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .semantic-legend .swatch { width: 14px; height: 14px; border: 1px solid rgba(255,255,255,.6); }
  #semantic-annotations { position: absolute; inset: 0; pointer-events: none; }
  .semantic-annotation { position: absolute; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="viewer"></canvas>
<div id="status">loading…</div>
<div id="passes"></div>
<div id="clip-controls"></div>
<div id="layers"></div>
<div id="semantic-legends-left" class="semantic-legends"></div>
<div id="semantic-legends-right" class="semantic-legends"></div>
<div id="semantic-annotations"></div>
<script type="importmap">
{
  "imports": {
    "three": {{THREE_MODULE_URL}},
    "three/addons/": {{THREE_ADDONS_URL}}
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const GLB_DATA_URI = {{GLB_DATA_URI}};
const INITIAL_EYE    = {{INITIAL_EYE}};
const INITIAL_TARGET = {{INITIAL_TARGET}};
const INITIAL_UP     = {{INITIAL_UP}};
const BG_PRESETS = {{BG_PRESETS_JSON}};  // { light: {center,edge}, dark: {center,edge} }
let bgMode = {{BG_MODE}};
const ENVMAP = {{ENVMAP_JSON}};
const RENDER_PASSES = ["albedo", "depth", "normal"];
const INITIAL_CAMERA_MODE = {{INITIAL_CAMERA_MODE}};
const INITIAL_ORTHO_SCALE = {{INITIAL_ORTHO_SCALE}};
// One { index, label } entry per rendered layer (view), in view order. Drives
// the per-layer visibility checkboxes; empty for single-layer scenes.
const LAYERS = {{LAYERS_JSON}};
const LEGENDS = {{LEGENDS_JSON}};
const ANNOTATIONS = {{ANNOTATIONS_JSON}};
// index -> array of top-level scene nodes tagged with that layer (populated on load).
let layerNodeMap = new Map();

const canvas = document.getElementById('viewer');
const status = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Match the Mitsuba backend, which writes radiance with a plain linear->sRGB
// transfer function and no filmic curve. ACES would shift brightness and
// desaturate relative to Mitsuba; NoToneMapping + SRGBColorSpace reproduces
// Mitsuba's encode exactly.
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.0;

// Soft "studio" background: a radial gradient texture, bright at the centre
// falling off to the edge colour, for the selected light/dark preset. Assigned
// to scene.background so three's pipeline — including the transmission render
// pass used by glass (ThinDielectric) — samples it, keeping transparent
// materials glass-like instead of dark. Regenerated on resize and on toggle.
function _rgb(c) {
  return `rgb(${Math.round(c[0] * 255)}, ${Math.round(c[1] * 255)}, ${Math.round(c[2] * 255)})`;
}
function makeStudioBackground(w, h) {
  const palette = BG_PRESETS[bgMode];
  const cv = document.createElement('canvas');
  cv.width = Math.max(2, w);
  cv.height = Math.max(2, h);
  const ctx = cv.getContext('2d');
  const cx = cv.width / 2;
  const cy = cv.height / 2;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(cx, cy));
  grad.addColorStop(0.0, _rgb(palette.center));
  grad.addColorStop(1.0, _rgb(palette.edge));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, cv.width, cv.height);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const scene = new THREE.Scene();
let studioBackground = makeStudioBackground(2, 2);
scene.background = studioBackground;
let envBackground = null;  // set to the PMREM texture when ENVMAP.background is true
// Apply the backend-neutral environment orientation encoded by envmap_descriptor.
let envRotationSupported = false; // three.js >= r163 exposes scene.environmentRotation
const _envMat = new THREE.Matrix4();
const _envEuler = new THREE.Euler();

function setBackgroundMode(mode) {
  if (!BG_PRESETS[mode]) return;
  bgMode = mode;
  const previous = studioBackground;
  studioBackground = makeStudioBackground(canvas.width, canvas.height);
  if (currentPass === 'beauty' && envBackground === null) {
    scene.background = studioBackground;
  }
  if (previous) previous.dispose();
  document.body.style.background = _rgb(BG_PRESETS[mode].edge);
  const btn = document.getElementById('btn-bg');
  if (btn) btn.textContent = mode === 'light' ? '☀' : '☾';
}

// Perspective and orthographic cameras share the same eye / orientation; the
// viewer toggles which one is active (perspective by default). OrbitControls
// drives whichever is active — `camera` is a live `let` so render/depth/save
// closures pick up the reassignment for free.
const perspCamera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
const orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 1000);
let camera = perspCamera;
let cameraMode = 'perspective';   // 'perspective' | 'orthographic'
let orthoHalfHeight = 1.0;        // vertical half-extent of the ortho frustum

perspCamera.position.set(INITIAL_EYE[0], INITIAL_EYE[1], INITIAL_EYE[2]);
perspCamera.up.set(INITIAL_UP[0], INITIAL_UP[1], INITIAL_UP[2]);
perspCamera.lookAt(INITIAL_TARGET[0], INITIAL_TARGET[1], INITIAL_TARGET[2]);
orthoCamera.position.copy(perspCamera.position);
orthoCamera.up.copy(perspCamera.up);
orthoCamera.quaternion.copy(perspCamera.quaternion);

const controls = new OrbitControls(camera, canvas);
controls.target.set(INITIAL_TARGET[0], INITIAL_TARGET[1], INITIAL_TARGET[2]);
controls.enableDamping = true;
controls.update();

// Refresh both projection matrices from the canvas aspect and the current ortho
// extent. Keeping the inactive camera current means a toggle is instant.
function updateCameraProjection() {
  const w = canvas.clientWidth || canvas.width || 1;
  const h = canvas.clientHeight || canvas.height || 1;
  const aspect = w / h;
  perspCamera.aspect = aspect;
  perspCamera.updateProjectionMatrix();
  const halfW = orthoHalfHeight * aspect;
  orthoCamera.left = -halfW;
  orthoCamera.right = halfW;
  orthoCamera.top = orthoHalfHeight;
  orthoCamera.bottom = -orthoHalfHeight;
  orthoCamera.updateProjectionMatrix();
}

// Toggle projection while preserving framing. Going orthographic, size the
// frustum from the current eye→target distance and the perspective fov (so the
// scene keeps its apparent size at the target plane). Coming back, map the
// accumulated ortho zoom onto an eye distance so perspective picks up where the
// ortho view left off. OrbitControls handles either camera type once reassigned.
function setCameraMode(mode) {
  if (mode !== 'perspective' && mode !== 'orthographic') return;
  if (mode === cameraMode) return;
  const fovRad = THREE.MathUtils.degToRad(perspCamera.fov);
  if (mode === 'orthographic') {
    const dist = perspCamera.position.distanceTo(controls.target);
    orthoHalfHeight = Math.max(dist * Math.tan(fovRad / 2), 1e-4);
    orthoCamera.position.copy(perspCamera.position);
    orthoCamera.up.copy(perspCamera.up);
    orthoCamera.quaternion.copy(perspCamera.quaternion);
    orthoCamera.zoom = 1;
    camera = orthoCamera;
  } else {
    const visibleHalfH = orthoHalfHeight / (orthoCamera.zoom || 1);
    const dist = Math.max(visibleHalfH / Math.tan(fovRad / 2), 1e-4);
    const dir = new THREE.Vector3().subVectors(orthoCamera.position, controls.target);
    if (dir.lengthSq() < 1e-12) dir.set(0, 0, 1);
    dir.normalize();
    perspCamera.up.copy(orthoCamera.up);
    perspCamera.position.copy(controls.target).addScaledVector(dir, dist);
    camera = perspCamera;
  }
  cameraMode = mode;
  updateCameraProjection();
  controls.object = camera;
  controls.update();
  const btn = document.getElementById('btn-projection');
  if (btn) {
    btn.textContent = mode === 'orthographic' ? '=' : '<';
    btn.classList.toggle('active', mode === 'orthographic');
  }
}
if (INITIAL_CAMERA_MODE === 'orthographic') {
  setCameraMode('orthographic');
  if (INITIAL_ORTHO_SCALE !== null) {
    orthoHalfHeight = INITIAL_ORTHO_SCALE * 0.5;
    updateCameraProjection();
  }
}

// Fallback 3-point lighting, used only when no envmap is supplied or the envmap
// fails to load. When the envmap loads successfully, `loadEnvmap` zeroes these
// so image-based lighting is the sole light source — matching the Mitsuba
// backend, which lights with the envmap alone. Leaving them on would
// double-count light on top of the envmap and look brighter than Mitsuba.
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
fillLight.position.set(-3, 1, 2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
rimLight.position.set(0, -2, -3);
scene.add(rimLight);

const ambient = new THREE.AmbientLight(0xffffff, 0.25);
scene.add(ambient);

function resize() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    updateCameraProjection();
    // Regenerate the studio gradient at the new aspect so it stays circular.
    const old = studioBackground;
    studioBackground = makeStudioBackground(w, h);
    if (currentPass === 'beauty' && envBackground === null) {
      scene.background = studioBackground;
    }
    if (old) old.dispose();
  }
}
window.addEventListener('resize', resize);

function updateEnvRotation() {
  if (!envRotationSupported || !ENVMAP) return;
  const m = ENVMAP.rotation_matrix || [1, 0, 0, 0, 1, 0, 0, 0, 1];
  _envMat.set(
    m[0], m[1], m[2], 0,
    m[3], m[4], m[5], 0,
    m[6], m[7], m[8], 0,
    0,    0,    0,    1,
  );
  // three.js negates environmentRotation internally. Transpose the desired
  // world transform and pre-negate its Euler angles to supply its inverse.
  _envMat.transpose();
  _envEuler.setFromRotationMatrix(_envMat);
  _envEuler.x *= -1; _envEuler.y *= -1; _envEuler.z *= -1;
  scene.environmentRotation.copy(_envEuler);
  if (envBackground !== null && 'backgroundRotation' in scene) {
    scene.backgroundRotation.copy(_envEuler);
  }
}

async function loadEnvmap() {
  if (!ENVMAP) return;
  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();

    let loader;
    if (ENVMAP.format === 'exr') {
      const mod = await import('three/addons/loaders/EXRLoader.js');
      loader = new mod.EXRLoader();
    } else {
      const mod = await import('three/addons/loaders/RGBELoader.js');
      loader = new mod.RGBELoader();
    }
    // EXR/RGBELoader extend DataTextureLoader: load() wraps parse() output
    // into a real DataTexture. We pass the data URI directly.
    const tex = await new Promise((resolve, reject) => {
      loader.load(ENVMAP.uri, resolve, undefined, reject);
    });
    tex.mapping = THREE.EquirectangularReflectionMapping;
    const envTexture = pmrem.fromEquirectangular(tex).texture;
    scene.environment = envTexture;
    if ('environmentIntensity' in scene) {
      scene.environmentIntensity = ENVMAP.scale;
    }
    // Apply Mitsuba's align-y-to-up and azimuth transform from the descriptor.
    // Requires three.js >= r163.
    if ('environmentRotation' in scene) {
      envRotationSupported = true;
      if (ENVMAP.background) {
        scene.background = envTexture;
        envBackground = envTexture;
      }
      updateEnvRotation();
    } else if (ENVMAP.background) {
      scene.background = envTexture;
      envBackground = envTexture;
    }
    // The envmap now lights the scene via image-based lighting, exactly like
    // the Mitsuba backend (which uses the envmap as its only emitter). The
    // analytic 3-point rig below is a fallback for when the envmap fails to
    // load, so switch it off now that IBL is active — otherwise it double-counts
    // light on top of the envmap and the result looks markedly brighter than
    // Mitsuba. Reached only after env setup fully succeeds; the catch below
    // leaves the lights on.
    keyLight.intensity = 0;
    fillLight.intensity = 0;
    rimLight.intensity = 0;
    ambient.intensity = 0;
    tex.dispose();
    pmrem.dispose();
  } catch (err) {
    console.warn('envmap load failed, falling back to lights:', err);
  }
}

function applyHakowanShaderPatches(root) {
  // Walk the loaded glTF tree, find materials with userData.hakowan, and
  // patch their shader compile step. The glTF "extras" object lands on
  // material.userData when read by GLTFLoader.
  root.traverse((obj) => {
    if (!obj.isMesh || !obj.material) return;
    const meta = obj.material.userData && obj.material.userData.hakowan;
    if (!meta) return;

    const material = obj.material;
    const isoParams = meta.isocontour;
    const principledAttrs = meta.principled_attrs;
    const backParams = meta.back;

    material.onBeforeCompile = (shader) => {
      let injectVertHead = "";
      let injectVertBody = "";
      let injectFragHead = "";
      let injectFragDiffuse = "";
      let injectFragRough = "";
      let injectFragMetal = "";

      if (isoParams) {
        shader.uniforms.uNumContours = { value: isoParams.num_contours };
        shader.uniforms.uRatio = { value: isoParams.ratio };
        shader.uniforms.uIsoColor1 = {
          value: new THREE.Color(...(isoParams.color1 || [1, 1, 1])),
        };
        shader.uniforms.uIsoColor2 = {
          value: new THREE.Color(...(isoParams.color2 || [1, 1, 1])),
        };
        injectVertHead += "attribute float _scalar_0;\nvarying float vScalar0;\n";
        injectVertBody += "vScalar0 = _scalar_0;\n";
        injectFragHead +=
          "varying float vScalar0;\nuniform float uNumContours;\n"
          + "uniform float uRatio;\nuniform vec3 uIsoColor1;\nuniform vec3 uIsoColor2;\n";

        // A ScalarField band carries a colormap, so its color varies per
        // vertex: bind the baked vec3 attribute as a varying and use it in
        // place of the flat uniform. Falls back to the uniform when absent.
        let color1Expr = "uIsoColor1";
        let color2Expr = "uIsoColor2";
        if (isoParams.color1_attr) {
          injectVertHead += `attribute vec3 ${isoParams.color1_attr};\nvarying vec3 vIsoColor1;\n`;
          injectVertBody += `vIsoColor1 = ${isoParams.color1_attr};\n`;
          injectFragHead += "varying vec3 vIsoColor1;\n";
          color1Expr = "vIsoColor1";
        }
        if (isoParams.color2_attr) {
          injectVertHead += `attribute vec3 ${isoParams.color2_attr};\nvarying vec3 vIsoColor2;\n`;
          injectVertBody += `vIsoColor2 = ${isoParams.color2_attr};\n`;
          injectFragHead += "varying vec3 vIsoColor2;\n";
          color2Expr = "vIsoColor2";
        }

        // Replicate the Mitsuba backend exactly: it renders the isocontour with
        // the `checkerboard` plugin sampled at UV (s*n, s*n + (1-ratio)/2), so a
        // texel is on a contour line when fract(u) and fract(v) straddle 0.5
        // (i.e. (fract(u) > 0.5) XOR (fract(v) > 0.5)). That yields two thin
        // stripes per contour period; a single `step` band would draw half as
        // many lines (twice as wide) and not line up with Mitsuba.
        injectFragDiffuse +=
          "{ float uIso = vScalar0 * uNumContours;"
          + "  float vIso = uIso + (1.0 - uRatio) * 0.5;"
          + "  float onLine = abs(step(0.5, fract(uIso)) - step(0.5, fract(vIso)));"
          + `  vec3 isoColor = mix(${color1Expr}, ${color2Expr}, onLine);`
          + "  diffuseColor.rgb *= isoColor; }\n";
      }

      if (principledAttrs && principledAttrs.roughness_attr) {
        const roughAttr = principledAttrs.roughness_attr;
        injectVertHead += `attribute float ${roughAttr};\nvarying float vRoughness0;\n`;
        injectVertBody += `vRoughness0 = ${roughAttr};\n`;
        injectFragHead += "varying float vRoughness0;\n";
        injectFragRough += "roughnessFactor *= clamp(vRoughness0, 0.0, 1.0);\n";
      }
      if (principledAttrs && principledAttrs.metallic_attr) {
        const metalAttr = principledAttrs.metallic_attr;
        injectVertHead += `attribute float ${metalAttr};\nvarying float vMetallic0;\n`;
        injectVertBody += `vMetallic0 = ${metalAttr};\n`;
        injectFragHead += "varying float vMetallic0;\n";
        injectFragMetal += "metalnessFactor *= clamp(vMetallic0, 0.0, 1.0);\n";
      }

      if (backParams) {
        // Override the diffuse base color on back faces. `gl_FrontFacing` is
        // only meaningful when the material is double-sided, which the WebGL
        // material translator guarantees whenever back_side is set. Appended
        // last so it wins over any front-only tint (e.g. isocontour stripes).
        shader.uniforms.uBackColor = {
          value: new THREE.Color(...backParams.color),
        };
        injectFragHead += "uniform vec3 uBackColor;\n";
        injectFragDiffuse += "if (!gl_FrontFacing) { diffuseColor.rgb = uBackColor; }\n";
      }

      shader.vertexShader = (injectVertHead + shader.vertexShader).replace(
        "#include <begin_vertex>",
        "#include <begin_vertex>\n" + injectVertBody,
      );
      shader.fragmentShader = (injectFragHead + shader.fragmentShader)
        .replace(
          "#include <color_fragment>",
          "#include <color_fragment>\n" + injectFragDiffuse,
        )
        .replace(
          "#include <roughnessmap_fragment>",
          "#include <roughnessmap_fragment>\n" + injectFragRough,
        )
        .replace(
          "#include <metalnessmap_fragment>",
          "#include <metalnessmap_fragment>\n" + injectFragMetal,
        );
    };
    // Force a recompile next frame.
    material.needsUpdate = true;
  });
}

// --------------------------------------------------------------------- //
// Render passes                                                           //
// --------------------------------------------------------------------- //
// Mitsuba writes albedo/depth/normal as separate AOV images. We can't
// pre-render those server-side, so the viewer instead exposes a per-pass
// material override plus a "save PNG" button to capture the current pass.
//
// We swap per-mesh materials in-place (cached so the swap is O(N) and
// cheap) rather than using `scene.overrideMaterial` so each mesh can
// preserve its own albedo texture / vertex colors when in the albedo pass.

const PASS_ORIGINAL = '__hakowan_orig_mat__';
const PASS_CACHE = '__hakowan_pass_cache__';
let currentPass = 'beauty';
let loadedRoot = null;
let sceneBbox = null;

// --------------------------------------------------------------------- //
// Object rotation                                                         //
// When enabled, dragging rotates each juxtaposition cell about its own    //
// centre (camera fixed) instead of orbiting the camera. Cells are grouped //
// by the `hakowan_cell` node extra written by the WebGL backend.          //
// --------------------------------------------------------------------- //
let objectRotateEnabled = false;
const qObjectRotation = new THREE.Quaternion();
let cellGroups = [];  // [{ center: Vector3, entries: [{ node, M0: Matrix4 }] }]

function _hasGeometry(obj) {
  let found = false;
  obj.traverse((o) => {
    if (o.isMesh || o.isInstancedMesh || o.isLine || o.isLineSegments || o.isPoints) {
      found = true;
    }
  });
  return found;
}

function buildCellGroups(root) {
  // Group the scene's renderable nodes by their `hakowan_cell` tag. Lights and
  // cameras carry no geometry and are skipped, so they never rotate.
  const byCell = new Map();
  for (const child of root.children) {
    if (!_hasGeometry(child)) continue;
    const tag = (child.userData && child.userData.hakowan_cell) || '__default__';
    if (!byCell.has(tag)) byCell.set(tag, []);
    byCell.get(tag).push(child);
  }
  root.updateWorldMatrix(true, false);
  const parentInv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  cellGroups = [];
  for (const nodes of byCell.values()) {
    const box = new THREE.Box3();
    for (const n of nodes) box.expandByObject(n);
    // Pivot = cell centre expressed in the nodes' parent (scene-root) space.
    const center = box.getCenter(new THREE.Vector3()).applyMatrix4(parentInv);
    const entries = nodes.map((n) => {
      n.matrixAutoUpdate = false;
      return { node: n, M0: n.matrix.clone() };
    });
    cellGroups.push({ center, entries });
  }
}

function applyObjectRotation() {
  const rot = new THREE.Matrix4().makeRotationFromQuaternion(qObjectRotation);
  for (const cell of cellGroups) {
    const c = cell.center;
    // pivot = T(c) · R · T(-c)
    const pivot = new THREE.Matrix4()
      .makeTranslation(c.x, c.y, c.z)
      .multiply(rot)
      .multiply(new THREE.Matrix4().makeTranslation(-c.x, -c.y, -c.z));
    for (const e of cell.entries) {
      e.node.matrix.copy(pivot).multiply(e.M0);
      e.node.matrixWorldNeedsUpdate = true;
    }
  }
  // The depth pass normalises against the world bbox, which moves as cells turn.
  if (loadedRoot !== null) {
    loadedRoot.updateMatrixWorld(true);
    sceneBbox = new THREE.Box3().setFromObject(loadedRoot);
  }
}

function setObjectRotateEnabled(enabled) {
  objectRotateEnabled = enabled;
  // Left-drag rotates objects in this mode; OrbitControls keeps pan/zoom.
  controls.enableRotate = !enabled;
  if (enabled) {
    // Cancel any leftover orbit damping so the camera doesn't keep drifting
    // after the switch (one update with damping off zeroes the inertia).
    const damping = controls.enableDamping;
    controls.enableDamping = false;
    controls.update();
    controls.enableDamping = damping;
  }
  const btn = document.getElementById('btn-objrotate');
  if (btn) btn.classList.toggle('active', enabled);
}

(function installObjectRotationHandlers() {
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  const ROT_SPEED = 0.01;
  canvas.addEventListener('pointerdown', (e) => {
    if (!objectRotateEnabled || e.button !== 0) return;
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    // Trackball about the camera's screen axes so it feels direct.
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1).normalize();
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).normalize();
    qObjectRotation
      .premultiply(new THREE.Quaternion().setFromAxisAngle(up, dx * ROT_SPEED))
      .premultiply(new THREE.Quaternion().setFromAxisAngle(right, dy * ROT_SPEED));
    applyObjectRotation();
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  // Double-click resets the object orientation.
  canvas.addEventListener('dblclick', () => {
    if (!objectRotateEnabled) return;
    qObjectRotation.identity();
    applyObjectRotation();
  });
})();

// --------------------------------------------------------------------- //
// Wireframe overlay                                                       //
// --------------------------------------------------------------------- //
// For each triangle mesh we create a THREE.LineSegments child whose
// geometry is WireframeGeometry(mesh.geometry). THREE.LineSegments draws
// with gl.LINES, so every triangle edge becomes a line primitive.
// Parenting to the mesh means the overlay follows the mesh transform for
// free and no world-matrix bookkeeping is needed.

let wireframeVisible = false;
const wireframeObjects = [];
const wireframeMat = new THREE.LineBasicMaterial({
  color: 0x000000,
  opacity: 0.3,
  transparent: true,
});

function buildWireframe(root) {
  root.traverse((obj) => {
    if (!obj.isMesh) return;
    // WireframeGeometry would wireframe only the single prototype of an
    // InstancedMesh (e.g. GPU-instanced curve tubes), not each instance —
    // skip it rather than draw one stray cylinder.
    if (obj.isInstancedMesh) return;
    const lines = new THREE.LineSegments(
      new THREE.WireframeGeometry(obj.geometry),
      wireframeMat,
    );
    lines.visible = false;
    lines.userData.isWireframe = true;
    obj.add(lines);
    wireframeObjects.push(lines);
  });
}

function toggleWireframe() {
  wireframeVisible = !wireframeVisible;
  for (const wf of wireframeObjects) {
    wf.visible = wireframeVisible;
  }
  const btn = document.getElementById('btn-wireframe');
  if (btn) btn.classList.toggle('active', wireframeVisible);
}

// --------------------------------------------------------------------- //
// Clipping plane                                                         //
// --------------------------------------------------------------------- //
// A single world-space THREE.Plane fed to renderer.clippingPlanes (a global
// clip applied to every material that supports clipping — the built-in PBR /
// basic / line materials do automatically, and our custom depth/normal pass
// shaders opt in via `clipping: true` + the clipping_planes include chunks).
// The plane keeps the half-space its normal points into; the slider slides it
// along that normal across the scene bbox, and partial triangles fall out of
// the GPU fragment clip for free (no re-meshing).

let clipEnabled = false;
let clipAxis = 'x';      // 'x' | 'y' | 'z'
let clipFlip = false;    // flip which side is kept
let clipOffset = 0.0;    // position along the axis, as a fraction of half-extent
const clipPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);

function updateClipPlane() {
  if (sceneBbox === null) return;
  const center = new THREE.Vector3();
  const size = new THREE.Vector3();
  sceneBbox.getCenter(center);
  sceneBbox.getSize(size);
  const n = new THREE.Vector3(
    clipAxis === 'x' ? 1 : 0,
    clipAxis === 'y' ? 1 : 0,
    clipAxis === 'z' ? 1 : 0,
  );
  if (clipFlip) n.negate();
  const extent = clipAxis === 'x' ? size.x : clipAxis === 'y' ? size.y : size.z;
  const half = 0.5 * (extent || 1.0);
  const pt = center.clone().addScaledVector(n, clipOffset * half);
  clipPlane.setFromNormalAndCoplanarPoint(n, pt);
  renderer.clippingPlanes = clipEnabled ? [clipPlane] : [];
}

function toggleClip() {
  clipEnabled = !clipEnabled;
  const btn = document.getElementById('btn-clip');
  if (btn) btn.classList.toggle('active', clipEnabled);
  const panel = document.getElementById('clip-controls');
  if (panel) panel.classList.toggle('visible', clipEnabled);
  updateClipPlane();
}

function buildClipUI() {
  const panel = document.getElementById('clip-controls');
  if (!panel) return;
  const axisRow = document.createElement('div');
  axisRow.className = 'row';
  for (const ax of ['x', 'y', 'z']) {
    const b = document.createElement('button');
    b.textContent = ax.toUpperCase();
    b.dataset.axis = ax;
    if (ax === clipAxis) b.classList.add('active');
    b.addEventListener('click', () => {
      clipAxis = ax;
      for (const bb of panel.querySelectorAll('button[data-axis]')) {
        bb.classList.toggle('active', bb.dataset.axis === ax);
      }
      updateClipPlane();
    });
    axisRow.appendChild(b);
  }
  const flip = document.createElement('button');
  flip.textContent = 'flip';
  flip.title = 'Flip which side of the plane is kept';
  flip.addEventListener('click', () => {
    clipFlip = !clipFlip;
    flip.classList.toggle('active', clipFlip);
    updateClipPlane();
  });
  axisRow.appendChild(flip);
  panel.appendChild(axisRow);

  const sliderRow = document.createElement('div');
  sliderRow.className = 'row';
  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = '-1';
  slider.max = '1';
  slider.step = '0.005';
  slider.value = '0';
  slider.title = 'Slide the plane along its normal';
  slider.addEventListener('input', () => {
    clipOffset = parseFloat(slider.value);
    updateClipPlane();
  });
  sliderRow.appendChild(slider);
  panel.appendChild(sliderRow);
}

// --------------------------------------------------------------------- //
// Two-sided rendering                                                    //
// --------------------------------------------------------------------- //
// A global override that forces every surface material to THREE.DoubleSide so
// back faces (e.g. the open cross-section left by a clipping plane, or
// inward-facing facets of a non-watertight mesh) are shaded instead of culled.
// Each material's natural side is remembered so the toggle can restore it.

let twoSided = false;

function baseSideOf(mat) {
  mat.userData = mat.userData || {};
  if (mat.userData.__baseSide === undefined) {
    mat.userData.__baseSide = mat.side ?? THREE.FrontSide;
  }
  return mat.userData.__baseSide;
}

function applyTwoSided() {
  if (loadedRoot === null) return;
  loadedRoot.traverse((obj) => {
    if (obj.userData && obj.userData.isWireframe) return;
    const mats = [];
    if (obj.material) mats.push(obj.material);
    if (obj[PASS_CACHE]) {
      for (const key in obj[PASS_CACHE]) {
        const m = obj[PASS_CACHE][key];
        if (m && !mats.includes(m)) mats.push(m);
      }
    }
    for (const m of mats) {
      const base = baseSideOf(m);
      m.side = twoSided ? THREE.DoubleSide : base;
      m.needsUpdate = true;
    }
  });
}

function toggleTwoSided() {
  twoSided = !twoSided;
  const btn = document.getElementById('btn-twosided');
  if (btn) btn.classList.toggle('active', twoSided);
  applyTwoSided();
}

// The renderer is sRGB-output; built-in materials like MeshBasic include the
// `<colorspace_fragment>` chunk that does linear→sRGB. ShaderMaterial doesn't,
// and neither does MeshNormalMaterial — they'd push linear values into an
// sRGB drawing buffer, which the display interprets as if they were sRGB
// (mid-gray ≈ 0.5 → linear 0.214 → looks "too dark / mostly black"). Inject
// the same conversion at the end of every custom pass shader.
const SRGB_GLSL = `
  vec3 linearToSRGB(vec3 c) {
    c = max(c, vec3(0.0));
    vec3 lo = c * 12.92;
    vec3 hi = pow(c, vec3(1.0 / 2.4)) * 1.055 - 0.055;
    return mix(hi, lo, vec3(lessThanEqual(c, vec3(0.0031308))));
  }
`;

// Linear camera-space depth in [uDepthMin, uDepthMax] → grayscale.
// Matches Mitsuba's depth pass convention: near = 0 (black), far = 1 (white).
// One shared uniforms object so all per-mesh materials update together each
// frame in the animate loop.
const depthUniforms = {
  uDepthMin: { value: 0.0 },
  uDepthMax: { value: 1.0 },
};
// Built from three.js' own vertex ShaderChunks. <project_vertex> applies the
// instanceMatrix (GPU-instanced curve tubes) under #ifdef USE_INSTANCING, so
// instancing — plus skinning/morph/batching — is handled out of the box; it
// declares mvPosition (view space) and writes gl_Position for us.
const DEPTH_VS = `
  #include <common>
  #include <clipping_planes_pars_vertex>
  varying float vDepth;
  void main() {
    #include <begin_vertex>
    #include <project_vertex>
    vDepth = -mvPosition.z;
    #include <clipping_planes_vertex>
  }
`;
const DEPTH_FS = `
  #include <clipping_planes_pars_fragment>
` + SRGB_GLSL + `
  varying float vDepth;
  uniform float uDepthMin;
  uniform float uDepthMax;
  void main() {
    #include <clipping_planes_fragment>
    float range = max(uDepthMax - uDepthMin, 1e-6);
    float t = clamp((vDepth - uDepthMin) / range, 0.0, 1.0);
    gl_FragColor = vec4(linearToSRGB(vec3(t)), 1.0);
  }
`;

function makeDepthMaterial(side) {
  return new THREE.ShaderMaterial({
    uniforms: depthUniforms,
    vertexShader: DEPTH_VS,
    fragmentShader: DEPTH_FS,
    side: side ?? THREE.FrontSide,
    toneMapped: false,
    clipping: true,
  });
}

// Custom normal-pass shader. Uses the geometry's interpolated vertex normal
// in view space; we apply sRGB encoding manually because MeshNormalMaterial
// skips `<colorspace_fragment>` and would otherwise look crushed-dark.
// <defaultnormal_vertex> produces transformedNormal in view space with the
// proper instancing correction (inverse-scaled instanceMatrix 3x3), so the
// normal pass also gets instancing out of the box.
const NORMAL_VS = `
  #include <common>
  #include <clipping_planes_pars_vertex>
  varying vec3 vViewNormal;
  void main() {
    #include <beginnormal_vertex>
    #include <defaultnormal_vertex>
    vViewNormal = normalize( transformedNormal );
    #include <begin_vertex>
    #include <project_vertex>
    #include <clipping_planes_vertex>
  }
`;
const NORMAL_FS = `
  #include <clipping_planes_pars_fragment>
` + SRGB_GLSL + `
  varying vec3 vViewNormal;
  void main() {
    #include <clipping_planes_fragment>
    vec3 n = normalize(vViewNormal);
    vec3 packed = n * 0.5 + 0.5;
    gl_FragColor = vec4(linearToSRGB(packed), 1.0);
  }
`;

function makeNormalMaterial(side) {
  return new THREE.ShaderMaterial({
    vertexShader: NORMAL_VS,
    fragmentShader: NORMAL_FS,
    side: side ?? THREE.FrontSide,
    toneMapped: false,
    clipping: true,
  });
}

function ensurePassMaterials(obj) {
  if (!obj.isMesh && !obj.isLine && !obj.isPoints) return null;
  if (obj.userData && obj.userData.isWireframe) return null;
  if (obj[PASS_CACHE]) return obj[PASS_CACHE];
  const orig = obj.material;
  obj[PASS_ORIGINAL] = orig;
  const cache = { beauty: orig };
  // `baseSide` is the material's natural side; the live side is derived from it
  // and the global two-sided override so the two stay consistent regardless of
  // the order in which passes are opened and the toggle is flipped.
  const baseSide = baseSideOf(orig);
  const side = twoSided ? THREE.DoubleSide : baseSide;
  const meta = orig.userData && orig.userData.hakowan;
  const isCurve = !!(meta && meta.kind === 'curve');

  // Depth works for Mesh, Line, and Points — it's a pure position transform.
  cache.depth = makeDepthMaterial(side);

  if (obj.isMesh) {
    cache.albedo = new THREE.MeshBasicMaterial({
      color: orig.color ? orig.color.clone() : new THREE.Color(0xffffff),
      map: orig.map || null,
      vertexColors: !!orig.vertexColors,
      side,
      transparent: !!orig.transparent,
      opacity: orig.opacity ?? 1.0,
      alphaMap: orig.alphaMap || null,
      toneMapped: false,
    });
    if (isCurve) {
      // Curve decorations (wireframe / seam tubes / etc.) have radial tube
      // normals that would obliterate the underlying surface normal in the
      // viewport. Render them as flat dark silhouettes so the surface
      // normals remain visible beneath while the curve outline still reads.
      cache.normal = new THREE.MeshBasicMaterial({
        color: 0x111111,
        side,
        toneMapped: false,
      });
    } else {
      cache.normal = makeNormalMaterial(side);
    }
  } else {
    // Lines / Points have no shading normal; fall back to flat color for
    // albedo (preserve original color) and a neutral gray for normal.
    const flat = (rgb) => obj.isLine
      ? new THREE.LineBasicMaterial({ color: rgb, toneMapped: false })
      : new THREE.PointsMaterial({ color: rgb, size: orig.size ?? 1, toneMapped: false });
    cache.albedo = flat(orig.color ? orig.color.clone() : new THREE.Color(0xffffff));
    cache.normal = flat(new THREE.Color(0x808080));
  }
  // Remember each pass material's natural side so the two-sided toggle can
  // restore it when switched off.
  for (const key in cache) {
    const m = cache[key];
    if (m === orig) continue;
    m.userData = m.userData || {};
    m.userData.__baseSide = baseSide;
  }
  obj[PASS_CACHE] = cache;
  return cache;
}

const _depthCorner = new THREE.Vector3();
function updateDepthRange() {
  if (sceneBbox === null) return;
  const corner = _depthCorner;
  let zmin = Infinity;
  let zmax = -Infinity;
  for (let i = 0; i < 8; i++) {
    corner.set(
      (i & 1) ? sceneBbox.max.x : sceneBbox.min.x,
      (i & 2) ? sceneBbox.max.y : sceneBbox.min.y,
      (i & 4) ? sceneBbox.max.z : sceneBbox.min.z,
    );
    corner.applyMatrix4(camera.matrixWorldInverse);
    const z = -corner.z;
    if (z < zmin) zmin = z;
    if (z > zmax) zmax = z;
  }
  zmin = Math.max(zmin, 1e-4);
  if (zmax <= zmin) zmax = zmin + 1.0;
  depthUniforms.uDepthMin.value = zmin;
  depthUniforms.uDepthMax.value = zmax;
}

function setPass(pass) {
  if (loadedRoot === null) return;
  currentPass = pass;
  loadedRoot.traverse((obj) => {
    const cache = ensurePassMaterials(obj);
    if (!cache) return;
    obj.material = cache[pass] || cache.beauty;
  });
  // Background only shown in beauty pass; passes get a flat background to
  // keep the saved PNG free of envmap clutter.
  if (pass === 'beauty') {
    scene.background = envBackground !== null ? envBackground : studioBackground;
  } else if (pass === 'depth') {
    scene.background = new THREE.Color(1, 1, 1);
  } else {
    scene.background = new THREE.Color(0, 0, 0);
  }
  for (const btn of document.querySelectorAll('#passes button[data-pass]')) {
    btn.classList.toggle('active', btn.dataset.pass === pass);
  }
}

function savePassPng() {
  // Render once into the canvas, then read it back. The animation loop
  // would overwrite it on next tick, so we grab it right after a render.
  renderer.render(scene, camera);
  canvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stem = (document.title || 'hakowan').replace(/\s+/g, '_');
    a.href = url;
    a.download = `${stem}_${currentPass}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
}

function setCameraState(state) {
  setCameraMode(state.mode || 'perspective');
  const active = camera;
  if (active.isOrthographicCamera && state.scale !== undefined && state.scale !== null) {
    orthoHalfHeight = state.scale * 0.5;
    updateCameraProjection();
  }
  active.position.fromArray(state.eye);
  active.up.fromArray(state.up);
  controls.target.fromArray(state.target);
  active.lookAt(controls.target);
  if (active.isPerspectiveCamera && state.fov !== undefined) active.fov = state.fov;
  if (state.near !== undefined) active.near = state.near;
  if (state.far !== undefined) active.far = state.far;
  active.updateProjectionMatrix();
  active.updateMatrixWorld(true);
  controls.object = active;
  controls.enableDamping = false;
  controls.update();
  _geometrySampleCache = null;
}

function prepareCapture(width, height) {
  for (const id of ['status', 'passes', 'clip-controls', 'layers']) {
    const node = document.getElementById(id);
    if (node) node.style.display = 'none';
  }
  document.documentElement.style.width = `${width}px`;
  document.documentElement.style.height = `${height}px`;
  document.body.style.width = `${width}px`;
  document.body.style.height = `${height}px`;
  document.body.style.overflow = 'hidden';
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  renderer.setPixelRatio(1);
  renderer.setSize(width, height, false);
  updateCameraProjection();
}

function capturePng(pass = 'beauty') {
  setPass(pass);
  camera.updateMatrixWorld(true);
  if (pass === 'depth') updateDepthRange();
  renderer.render(scene, camera);
  return canvas.toDataURL('image/png');
}

function _typedArrayBase64(array) {
  const bytes = new Uint8Array(array.buffer, array.byteOffset, array.byteLength);
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode(...bytes.subarray(i, Math.min(i + chunk, bytes.length)));
  }
  return btoa(binary);
}

function _layerIndex(object) {
  let current = object;
  while (current) {
    const value = current.userData && current.userData.hakowan_layer;
    if (value !== undefined && value !== null) return value >>> 0;
    current = current.parent;
  }
  return 0xffffffff;
}

let _geometrySampleCache = null;
function sampleGeometry(width, height) {
  camera.updateMatrixWorld(true);
  loadedRoot.updateMatrixWorld(true);
  const key = [
    width, height,
    ...camera.matrixWorld.elements,
    ...camera.projectionMatrix.elements,
  ].join(',');
  if (_geometrySampleCache && _geometrySampleCache.key === key) {
    return _geometrySampleCache.value;
  }

  const count = width * height;
  const depth = new Float32Array(count);
  const element = new Uint32Array(count);
  const layer = new Uint32Array(count);
  const normal = new Float32Array(count * 3);
  depth.fill(Number.NaN);
  element.fill(0xffffffff);
  layer.fill(0xffffffff);
  normal.fill(Number.NaN);

  const raycaster = new THREE.Raycaster();
  const sceneSize = sceneBbox ? sceneBbox.getSize(new THREE.Vector3()).length() : 2.0;
  const threshold = Math.max(sceneSize / Math.max(width, height) * 1.5, 1e-5);
  raycaster.params.Line.threshold = threshold;
  raycaster.params.Points.threshold = threshold;
  const ndc = new THREE.Vector2();
  const cameraPoint = new THREE.Vector3();
  const worldNormal = new THREE.Vector3();

  for (let y = 0; y < height; y++) {
    ndc.y = 1.0 - 2.0 * (y + 0.5) / height;
    for (let x = 0; x < width; x++) {
      ndc.x = 2.0 * (x + 0.5) / width - 1.0;
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObject(loadedRoot, true);
      let hit = null;
      for (const candidate of hits) {
        if (!candidate.object.visible) continue;
        if (candidate.object.userData && candidate.object.userData.isWireframe) continue;
        hit = candidate;
        break;
      }
      if (hit === null) continue;
      const index = y * width + x;
      cameraPoint.copy(hit.point).applyMatrix4(camera.matrixWorldInverse);
      depth[index] = -cameraPoint.z;
      layer[index] = _layerIndex(hit.object);
      const rawElement = hit.instanceId ?? hit.faceIndex ?? hit.index;
      element[index] = rawElement === undefined || rawElement === null
        ? 0
        : rawElement >>> 0;
      if (hit.normal) {
        worldNormal.copy(hit.normal);
      } else if (hit.face) {
        worldNormal.copy(hit.face.normal).transformDirection(hit.object.matrixWorld);
      } else {
        worldNormal.set(0, 0, 0);
      }
      normal[index * 3] = worldNormal.x;
      normal[index * 3 + 1] = worldNormal.y;
      normal[index * 3 + 2] = worldNormal.z;
    }
  }

  const value = {
    width,
    height,
    depth: _typedArrayBase64(depth),
    element: _typedArrayBase64(element),
    layer: _typedArrayBase64(layer),
    normal: _typedArrayBase64(normal),
  };
  _geometrySampleCache = { key, value };
  return value;
}

function captureIdPng(kind, width, height) {
  const samples = sampleGeometry(width, height);
  const encoded = atob(kind === 'layer_id' ? samples.layer : samples.element);
  const bytes = Uint8Array.from(encoded, c => c.charCodeAt(0));
  const ids = new Uint32Array(bytes.buffer);
  const output = document.createElement('canvas');
  output.width = width;
  output.height = height;
  const context = output.getContext('2d');
  const image = context.createImageData(width, height);
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    const offset = i * 4;
    if (id === 0xffffffff) {
      image.data[offset + 3] = 0;
      continue;
    }
    const value = (id + 1) >>> 0;
    image.data[offset] = (value * 73) & 255;
    image.data[offset + 1] = (value * 151) & 255;
    image.data[offset + 2] = (value * 199) & 255;
    image.data[offset + 3] = 255;
  }
  context.putImageData(image, 0, 0);
  return output.toDataURL('image/png');
}

function captureState() {
  camera.updateMatrixWorld(true);
  return {
    worldToCamera: camera.matrixWorldInverse.toArray(),
    projection: camera.projectionMatrix.toArray(),
    bounds: sceneBbox ? [sceneBbox.min.toArray(), sceneBbox.max.toArray()] : null,
    depthRange: [depthUniforms.uDepthMin.value, depthUniforms.uDepthMax.value],
    mode: cameraMode,
  };
}

function buildPassUI() {
  if (!Array.isArray(RENDER_PASSES) || RENDER_PASSES.length === 0) return;
  const passes = ['beauty', ...RENDER_PASSES];
  const container = document.getElementById('passes');
  for (const p of passes) {
    const btn = document.createElement('button');
    btn.textContent = p;
    btn.dataset.pass = p;
    btn.addEventListener('click', () => setPass(p));
    container.appendChild(btn);
  }
  const sep = document.createElement('div');
  sep.className = 'sep';
  container.appendChild(sep);
  const wfBtn = document.createElement('button');
  wfBtn.id = 'btn-wireframe';
  wfBtn.textContent = 'wireframe';
  wfBtn.title = 'Toggle wireframe overlay (gl.LINES)';
  wfBtn.addEventListener('click', toggleWireframe);
  container.appendChild(wfBtn);
  const clipBtn = document.createElement('button');
  clipBtn.id = 'btn-clip';
  clipBtn.textContent = 'clip';
  clipBtn.title = 'Toggle an interactive clipping plane';
  clipBtn.addEventListener('click', toggleClip);
  container.appendChild(clipBtn);
  buildClipUI();
  const twoSidedBtn = document.createElement('button');
  twoSidedBtn.id = 'btn-twosided';
  twoSidedBtn.textContent = '2-sided';
  twoSidedBtn.title = 'Toggle two-sided (double-sided) rendering';
  twoSidedBtn.addEventListener('click', toggleTwoSided);
  container.appendChild(twoSidedBtn);
  const objRotBtn = document.createElement('button');
  objRotBtn.id = 'btn-objrotate';
  objRotBtn.textContent = 'rotate objects';
  objRotBtn.title =
    'Drag to rotate each object about its own centre (camera stays put); '
    + 'double-click to reset';
  objRotBtn.addEventListener('click', () => setObjectRotateEnabled(!objectRotateEnabled));
  container.appendChild(objRotBtn);
  const projBtn = document.createElement('button');
  projBtn.id = 'btn-projection';
  projBtn.textContent = cameraMode === 'orthographic' ? '=' : '<';
  projBtn.title = 'Toggle orthographic (=) / perspective (<) projection';
  projBtn.classList.toggle('active', cameraMode === 'orthographic');
  projBtn.addEventListener('click', () =>
    setCameraMode(cameraMode === 'perspective' ? 'orthographic' : 'perspective'));
  container.appendChild(projBtn);
  const bgBtn = document.createElement('button');
  bgBtn.id = 'btn-bg';
  bgBtn.textContent = bgMode === 'light' ? '☀' : '☾';
  bgBtn.title = 'Toggle light / dark background';
  bgBtn.addEventListener('click', () => setBackgroundMode(bgMode === 'light' ? 'dark' : 'light'));
  container.appendChild(bgBtn);
  const save = document.createElement('button');
  save.id = 'btn-save';
  save.textContent = '📷';
  save.title = 'Save a screenshot of the current pass (PNG)';
  save.addEventListener('click', savePassPng);
  container.appendChild(save);
  container.classList.add('visible');
  // Mark beauty as active initially.
  container.querySelector('button[data-pass="beauty"]').classList.add('active');
}

function buildLayerGroups(root) {
  // Map each top-level node to its layer index. The WebGL backend writes the
  // view index to glTF `extras.hakowan_layer`, which GLTFLoader surfaces as
  // `userData.hakowan_layer`. Untagged nodes (lights/cameras) are skipped.
  layerNodeMap = new Map();
  for (const child of root.children) {
    const idx = child.userData && child.userData.hakowan_layer;
    if (idx === undefined || idx === null) continue;
    if (!layerNodeMap.has(idx)) layerNodeMap.set(idx, []);
    layerNodeMap.get(idx).push(child);
  }
}

function setLayerVisible(index, visible) {
  // Hiding a top-level node hides its whole subtree, including the wireframe
  // overlay attached as a child of each mesh — so passes/screenshots follow.
  const nodes = layerNodeMap.get(index);
  if (!nodes) return;
  for (const n of nodes) n.visible = visible;
}

function buildLayerUI() {
  // A lone layer needs no toggle; only surface the panel for multi-layer scenes.
  if (!Array.isArray(LAYERS) || LAYERS.length < 2) return;
  const container = document.getElementById('layers');
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = 'layers';
  container.appendChild(title);
  for (const entry of LAYERS) {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = true;
    cb.addEventListener('change', () => setLayerVisible(entry.index, cb.checked));
    label.appendChild(cb);
    label.appendChild(document.createTextNode(entry.label));
    container.appendChild(label);
  }
  container.classList.add('visible');
}

function _cssColor(color, alpha = 1) {
  const values = color.map(value => Math.round(Math.max(0, Math.min(1, value)) * 255));
  return `rgba(${values[0]},${values[1]},${values[2]},${alpha})`;
}

function buildSemanticOverlays() {
  for (const legend of LEGENDS) {
    const container = document.getElementById(
      legend.position === 'left' ? 'semantic-legends-left' : 'semantic-legends-right'
    );
    const panel = document.createElement('div');
    panel.className = 'semantic-legend';
    const heading = document.createElement('div');
    heading.className = 'heading';
    heading.textContent = legend.title + (legend.units ? ` (${legend.units})` : '');
    panel.appendChild(heading);
    if (legend.scale && legend.scale.length) {
      const scale = document.createElement('div');
      scale.className = 'scale';
      scale.textContent = legend.scale.join(' → ');
      panel.appendChild(scale);
    }
    if (legend.categories) {
      legend.labels.forEach((label, index) => {
        const row = document.createElement('div');
        row.className = 'category';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = _cssColor(legend.colors[index]);
        const text = document.createElement('span');
        text.textContent = label;
        row.append(swatch, text);
        panel.appendChild(row);
      });
    } else {
      const body = document.createElement('div');
      body.className = 'continuous';
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.background = `linear-gradient(to top, ${legend.colors.map(c => _cssColor(c)).join(',')})`;
      const ticks = document.createElement('div');
      ticks.className = 'ticks';
      [...legend.labels].reverse().forEach(label => {
        const text = document.createElement('span');
        text.textContent = label;
        ticks.appendChild(text);
      });
      body.append(bar, ticks);
      panel.appendChild(body);
    }
    container.appendChild(panel);
  }
  const annotationRoot = document.getElementById('semantic-annotations');
  for (const annotation of ANNOTATIONS) {
    const node = document.createElement('div');
    node.className = 'semantic-annotation';
    node.textContent = annotation.text;
    node.style.left = `${annotation.position[0] * 100}%`;
    node.style.top = `${annotation.position[1] * 100}%`;
    node.style.color = _cssColor(annotation.color);
    node.style.fontSize = `${annotation.font_size}px`;
    node.style.padding = `${annotation.padding}px`;
    node.style.transform = annotation.anchor === 'center'
      ? 'translateX(-50%)'
      : annotation.anchor === 'right' ? 'translateX(-100%)' : 'none';
    if (annotation.background) node.style.background = _cssColor(annotation.background, 0.86);
    annotationRoot.appendChild(node);
  }
}

function applyCrispCheckerTextures(root) {
  // three.js may still build mipmaps for small PNGs; force point sampling so
  // baked checker cells stay sharp (see material extras from the WebGL backend).
  root.traverse((obj) => {
    if (!obj.isMesh || !obj.material) return;
    const meta = obj.material.userData && obj.material.userData.hakowan;
    if (!meta || !meta.checkerboard) return;
    const map = obj.material.map;
    if (!map) return;
    map.generateMipmaps = false;
    map.minFilter = THREE.NearestFilter;
    map.magFilter = THREE.NearestFilter;
    map.needsUpdate = true;
  });
}

const loader = new GLTFLoader();
const onLoaded = (gltf) => {
  scene.add(gltf.scene);
  applyHakowanShaderPatches(gltf.scene);
  applyCrispCheckerTextures(gltf.scene);
  buildWireframe(gltf.scene);
  loadedRoot = gltf.scene;
  // Group nodes into rotatable cells (after wireframe so its lines ride along).
  buildCellGroups(loadedRoot);
  // Map top-level nodes to their layer index for the visibility checkboxes.
  buildLayerGroups(loadedRoot);
  // World-space bbox of the loaded scene drives the depth-pass normalisation.
  sceneBbox = new THREE.Box3().setFromObject(loadedRoot);
  if (gltf.cameras && gltf.cameras.length > 0) {
    const cam = gltf.cameras[0];
    let startOrtho = false;
    if (cam.isPerspectiveCamera) {
      perspCamera.fov = cam.fov;
      perspCamera.near = cam.near;
      perspCamera.far = cam.far;
    } else if (cam.isOrthographicCamera) {
      // Honour an Orthographic sensor: start in ortho mode, sizing the frustum
      // from the glTF camera's vertical half-extent.
      perspCamera.near = orthoCamera.near = cam.near;
      perspCamera.far = orthoCamera.far = cam.far;
      orthoHalfHeight = Math.max(cam.top, 1e-4);
      startOrtho = true;
    }
    perspCamera.position.set(INITIAL_EYE[0], INITIAL_EYE[1], INITIAL_EYE[2]);
    perspCamera.up.set(INITIAL_UP[0], INITIAL_UP[1], INITIAL_UP[2]);
    perspCamera.lookAt(INITIAL_TARGET[0], INITIAL_TARGET[1], INITIAL_TARGET[2]);
    orthoCamera.position.copy(perspCamera.position);
    orthoCamera.up.copy(perspCamera.up);
    orthoCamera.quaternion.copy(perspCamera.quaternion);
    updateCameraProjection();
    camera = startOrtho ? orthoCamera : perspCamera;
    cameraMode = startOrtho ? 'orthographic' : 'perspective';
    controls.object = camera;
    controls.update();
  }
  buildPassUI();
  buildLayerUI();
  buildSemanticOverlays();
  // Juxtaposition scenes (built with the `|` operator) contain 2+ cells; default
  // to per-object rotation so dragging compares orientations rather than orbiting
  // the whole arrangement. Single-object/overlay scenes keep camera orbit.
  if (cellGroups.length >= 2) setObjectRotateEnabled(true);
  status.classList.add('hidden');
  // Stable automation handle used by snapshot()/observe() and end-to-end tests.
  window.__hakowan = {
    THREE, scene, renderer, canvas, camera, controls, loadedRoot,
    perspCamera, orthoCamera,
    hasEnvironment: () => scene.environment !== null,
    getCamera: () => camera,
    getCameraMode: () => cameraMode,
    setCameraMode,
    setCameraState,
    prepareCapture,
    setPass,
    capturePng,
    captureIdPng,
    captureState,
    sampleGeometry,
    getCellGroups: () => cellGroups,
    setObjectRotateEnabled,
    applyObjectRotation,
    qObjectRotation,
    getLayerNodes: () => layerNodeMap,
    setLayerVisible,
    updateEnvRotation,
  };
  window.__hakowan_loaded = true;
};
const onError = (err) => {
  // Most common cause when GLB_DATA_URI is a relative path (sidecar mode):
  // the user opened the .html directly under file:// and the browser refused
  // the sibling fetch. Surface a more actionable hint instead of just the
  // raw TypeError.
  const underFile = location.protocol === 'file:';
  const sidecar = !GLB_DATA_URI.startsWith('data:');
  let msg = 'failed to load scene: ' + (err && err.message ? err.message : err);
  if (underFile && sidecar) {
    msg += '  —  the scene was written as a sidecar .glb; browsers block '
        +  'sibling fetches under file://. Serve the folder over HTTP '
        +  '(e.g. `python -m http.server` in the output directory) and reload.';
  }
  status.textContent = msg;
  status.classList.remove('hidden');
  console.error(err);
};

(async () => {
  await loadEnvmap();
  if (GLB_DATA_URI.startsWith('data:')) {
    const binary = Uint8Array.from(atob(GLB_DATA_URI.split(',')[1]), c => c.charCodeAt(0));
    loader.parse(binary.buffer, '', onLoaded, onError);
  } else {
    loader.load(GLB_DATA_URI, onLoaded, undefined, onError);
  }
})();

function animate() {
  resize();
  controls.update();
  if (currentPass === 'depth') updateDepthRange();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
resize();
animate();
</script>
</body>
</html>
